name: CI

# Builds and tests only the Oracle-independent `core` module. The `extension` module needs
# jars from a local SQL Developer install, so it is skipped unless -Dsqldev.home is given.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test core
        run: mvn -B -ntp verify
