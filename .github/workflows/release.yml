name: Release

# Runs when a tag such as v0.3.0 is pushed. It checks that the tag, the pom version and the
# changelog agree, tests core, and opens a draft release with the changelog entry as its notes.
# The install zip needs jars from a SQL Developer install, so it is built locally
# (mvn package -Dsqldev.home=...) and attached to the draft before publishing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check the tag against the pom and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          pom=$(mvn -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "$version" != "$pom" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the pom version $pom"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: mvn -B -ntp verify

      - name: Write the release notes
        run: |
          awk -v header="## [$VERSION]" '
            index($0, "## [") == 1 { if (found) exit; found = index($0, header) == 1; next }
            found
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "## Install"
            echo "Help > Check for Updates > Install From Local File, pick the zip and restart SQL Developer."
            echo "Remove an older version first (see the README)."
          } >> release-notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
